# E21/HM3 — the HOME root App-of-Apps (the operator-applied bootstrap seed).
#
# Plays the role helm_release.argocd_apps plays on AWS (driftplain-infra/platform/
# argocd.tf): the ONE resource an operator applies by hand after installing the
# argo-cd chart; every other home resource is then reconciled from Git. It watches
# argocd/home-server/apps on main — NOT argocd/apps, which is the AWS EKS root's
# source — so the two clusters never share a child-app set. Non-recursive: child
# Applications are the flat files in that directory (cnpg-operator, modelmatch-
# postgres in HM3; the app/ingress/secrets children join in HM4 under this same root).
#
# Bootstrap (see driftplain-infra/home-server/HM3-RESTORE.md):
#   helm template argocd argo/argo-cd --version 9.5.21 -n argocd --include-crds \
#     -f argocd/home-server/argocd-values.yaml | kubectl apply --server-side -n argocd -f -
#   kubectl apply -n argocd -f argocd/home-server/root.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-server-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Steve-droid/driftplain-gitops.git
    targetRevision: main
    path: argocd/home-server/apps
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
