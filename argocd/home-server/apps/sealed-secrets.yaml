# E21/HM4 — Sealed Secrets controller for the HOME K3s cluster (selected September 15).
#
# Home has no ESO/AWS runtime identity, so app Secrets cannot be synced from Secrets
# Manager. Instead the operator seals the ORIGINAL values (from the age-encrypted HM3
# credential bundle) with this controller's public key into SealedSecret manifests that
# ARE committed (argocd/home-server/sealed/, the app-secrets child). Only this controller
# can unseal them. Strict scope: a sealed value is bound to its exact name + namespace.
#
# Key custody (infra home-server/HM4-HOME-APP.md): every sealing key Secret in this
# namespace (label sealedsecrets.bitnami.com/sealed-secrets-key) is backed up age-encrypted
# to the versioned backup bucket + the Mac, and the recovery is proven in isolation BEFORE
# any sealed manifest is relied on. The controller renews its key every 30 days (chart
# default) — each renewal needs a fresh backup (HM5 schedules it); old keys are retained
# by the controller so older manifests still unseal. Never seal Roles Anywhere leaves.
#
# sync-wave "-2": before the sealed manifests (app-secrets, wave 0), which need the CRD
# and a running controller. Home-only; AWS keeps ESO.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.20.0 # controller 0.40.0 (released 2026-09-10; kubeseal 0.40.0 on the Mac)
    helm:
      releaseName: sealed-secrets
      values: |
        # The upstream default controller name, so `kubeseal --controller-namespace
        # sealed-secrets` finds it without extra flags.
        fullnameOverride: sealed-secrets-controller
        # The chart ships no limits; repo rule: limits on every container.
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
