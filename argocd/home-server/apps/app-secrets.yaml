# E21/HM4 — the home app Secrets as SEALED manifests (the home counterpart of the AWS
# app-secrets child, which is an ESO ExternalSecret → Secrets Manager).
#
# Source: argocd/home-server/sealed/ — plain SealedSecret manifests (a directory source,
# not a chart: nothing to template), generated on the Mac by
# driftplain-infra/home-server/home-server-sealing-keys.py `seal` from the ORIGINAL HM3
# credential bundle, sealed with the home controller's public cert in STRICT scope:
#   • app/modelmatch-app-secrets (Opaque; exactly JWT_SECRET, POSTGRES_PASSWORD,
#     CHAT_READONLY_DB_PASSWORD, DEMO_SEED_PASSWORD) — the backend's secret env;
#   • app/modelmatch-db-app (kubernetes.io/basic-auth, cnpg.io/reload) — the CNPG owner
#     credential. It already exists on home (operator-created in HM3 with the same
#     value); the operator annotates it `sealedsecrets.bitnami.com/managed=true`
#     (`adopt`) BEFORE this child syncs so the controller takes ownership without
#     changing a byte.
# Only the home Sealed Secrets controller (wave -2) can unseal these; its keys are backed
# up age-encrypted off-machine and the recovery is proven (infra home-server/HM4-HOME-APP.md).
#
# sync-wave "0": after the controller (-2) and before modelmatch-postgres (1) / the app (2).
# NO CreateNamespace: `app` pre-exists (HM2). Never seal Roles Anywhere leaves here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Steve-droid/driftplain-gitops.git
    targetRevision: main
    path: argocd/home-server/sealed
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
