# E21/HM4 — SealedSecret for app/modelmatch-app-secrets (strict scope: name + namespace bound).
# Sealed on the Mac from the original HM3 credential bundle with the home controller's
# public certificate; only the home Sealed Secrets controller can unseal it. Regenerate
# with driftplain-infra/home-server/home-server-sealing-keys.py seal. Never edit by hand.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: modelmatch-app-secrets
  namespace: app
spec:
  encryptedData:
    CHAT_READONLY_DB_PASSWORD: 
    DEMO_SEED_PASSWORD: 
    JWT_SECRET: 
    POSTGRES_PASSWORD: 
  template:
    metadata:
      name: modelmatch-app-secrets
      namespace: app
    type: Opaque
