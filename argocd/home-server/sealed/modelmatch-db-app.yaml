# E21/HM4 — SealedSecret for app/modelmatch-db-app (strict scope: name + namespace bound).
# Sealed on the Mac from the original HM3 credential bundle with the home controller's
# public certificate; only the home Sealed Secrets controller can unseal it. Regenerate
# with driftplain-infra/home-server/home-server-sealing-keys.py seal. Never edit by hand.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: modelmatch-db-app
  namespace: app
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      labels:
        cnpg.io/reload: "true"
      name: modelmatch-db-app
      namespace: app
    type: kubernetes.io/basic-auth
