# argocd-values.yaml — values for the HOME K3s ArgoCD install (argo-cd chart 9.5.21,
# the same pin as AWS). E21/HM3 bootstraps a MINIMAL, DB-only home GitOps root; the
# rest of the home application profile joins under the same root in HM4.
#
# Mirrors the lean AWS values in driftplain-infra/platform/argocd.tf (P10): no SSO
# (dex), no notifications controller, limits on every component, and the Lua health
# check that makes the root App-of-Apps reflect its children's health (ArgoCD removed
# built-in Application health in v1.8). The ArgoCD server is NOT exposed: no ingress,
# no LoadBalancer; operators reach it only through an SSH-forwarded port-forward.
dex:
  enabled: false
notifications:
  enabled: false
configs:
  cm:
    # E21/HM4: the home ingress controller is a ClusterIP Service (no cloud load balancer),
    # so no controller ever writes status.loadBalancer.ingress on an Ingress and ArgoCD's
    # built-in Ingress health would stay "Progressing" forever. At home an Ingress is
    # Healthy once it exists with rules; reachability is proven by the HM4 validation
    # (SSH port-forward to the ClusterIP) and later by the tunnel connector (HM5).
    resource.customizations.health.networking.k8s.io_Ingress: |
      hs = {}
      hs.status = "Healthy"
      hs.message = "ClusterIP ingress controller: no load-balancer address is expected at home"
      if obj.spec == nil or obj.spec.rules == nil then
        hs.status = "Degraded"
        hs.message = "Ingress has no rules"
      end
      return hs
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
controller:
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1.5Gi
server:
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
applicationSet:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
