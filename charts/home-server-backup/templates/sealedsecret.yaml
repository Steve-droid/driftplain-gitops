{{- if or .Values.sealed.encryptedUsername .Values.sealed.encryptedPassword }}
{{- if not (and .Values.sealed.encryptedUsername .Values.sealed.encryptedPassword) }}
{{- fail "home-server-backup: sealed.encryptedUsername and sealed.encryptedPassword must both be set" }}
{{- end }}
# The owner credential copy for this namespace, sealed (strict scope) by the home controller from
# the HM3 bundle with home-server-sealing-keys.py seal-backup-owner. Same username/password as
# app/modelmatch-db-app; no CNPG reload label here.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.database.secretName }}
  namespace: {{ .Release.Namespace }}
spec:
  encryptedData:
    username: {{ .Values.sealed.encryptedUsername | quote }}
    password: {{ .Values.sealed.encryptedPassword | quote }}
  template:
    type: kubernetes.io/basic-auth
    metadata:
      name: {{ .Values.database.secretName }}
      namespace: {{ .Release.Namespace }}
{{- end }}
