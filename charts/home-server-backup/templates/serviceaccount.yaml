# A dedicated ServiceAccount with NO API token: the job talks to PostgreSQL and S3 only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: home-server-backup
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: home-server-backup
    app.kubernetes.io/part-of: driftplain-home-server
automountServiceAccountToken: false
