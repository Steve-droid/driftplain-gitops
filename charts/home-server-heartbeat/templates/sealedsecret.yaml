{{- if .Values.sealed.encryptedUrl }}
# The heartbeat URL, sealed (strict scope) for this namespace/name by the home controller.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ .Release.Namespace }}
spec:
  encryptedData:
    {{ .Values.secret.key }}: {{ .Values.sealed.encryptedUrl | quote }}
  template:
    type: Opaque
    metadata:
      name: {{ .Values.secret.name }}
      namespace: {{ .Release.Namespace }}
{{- end }}
