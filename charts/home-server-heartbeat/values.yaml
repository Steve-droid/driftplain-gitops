# charts/home-server-heartbeat — home-only (no AWS profile).
#
# enabled: false keeps the CronJob suspended. On since September 18 with sealed.encryptedUrl,
# the heartbeat URL sealed (strict scope) for monitoring/home-server-heartbeat by
# driftplain-infra home-server/home-server-sealing-keys.py seal-value (value on stdin). The URL is a bearer-like token:
# never in plain values, never in logs (the script prints outcomes, never the URL).
enabled: true
schedule: "*/5 * * * *"
image:
  repository: curlimages/curl
  digest: sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6 # 8.16.0
  # curlimages/curl runs as the unprivileged `curl_user` (uid 100, gid 101).
  uid: 100
  gid: 101
prometheusUrl: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
# Public-path probes: each URL is fetched through the Cloudflare edge (edge -> tunnel -> ingress)
# and must answer 2xx with the keyword in the body, or the heartbeat is withheld. Empty = skipped.
edgeProbes:
  - url: https://staging.driftplain.dev/
    keyword: Driftplain
  - url: https://api-staging.driftplain.dev/healthz
    keyword: ok
secret:
  name: home-server-heartbeat
  key: url
sealed:
  # SealedSecret encryptedData.url; empty = no Secret rendered (CronJob stays suspended).
  # Sealed September 18 for the external monitor; re-seal after the controller key renews.
  encryptedUrl: ""
resources:
  requests: { cpu: 10m, memory: 16Mi }
  limits: { cpu: 50m, memory: 32Mi }
