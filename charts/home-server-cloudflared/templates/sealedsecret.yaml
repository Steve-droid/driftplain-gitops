{{- if .Values.sealed.encryptedToken }}
# The tunnel token (terraform -chdir=cloudflare output -raw tunnel_token), sealed strict-scope
# for this namespace/name by the home controller (driftplain-infra home-server-sealing-keys.py).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ .Release.Namespace }}
spec:
  encryptedData:
    {{ .Values.secret.key }}: {{ .Values.sealed.encryptedToken | quote }}
  template:
    type: Opaque
    metadata:
      name: {{ .Values.secret.name }}
      namespace: {{ .Release.Namespace }}
{{- end }}
