{{- if and .Values.enabled (not .Values.sealed.encryptedToken) }}
{{- fail "home-server-cloudflared: enabled=true needs sealed.encryptedToken (the tunnel token sealed for this namespace)" }}
{{- end }}
# The connector: one small pod that dials out to Cloudflare (no inbound port, no hostNetwork,
# no ServiceAccount token) and serves the routes the remotely managed tunnel config defines
# (driftplain-infra/cloudflare: staging hosts only, origin TLS verified against the mounted
# home-server-ca pool). replicas 0 until `enabled`, so the token Secret need not exist first.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-server-cloudflared
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: home-server-cloudflared
    app.kubernetes.io/part-of: driftplain-home-server
spec:
  replicas: {{ if .Values.enabled }}{{ .Values.replicas }}{{ else }}0{{ end }}
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: home-server-cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-server-cloudflared
        app.kubernetes.io/part-of: driftplain-home-server
      annotations:
        checksum/ca: {{ .Values.origin.caCertificate | sha256sum }}
    spec:
      automountServiceAccountToken: false
      hostNetwork: false
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.image.uid }}
        runAsGroup: {{ .Values.image.gid }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: {{ .Values.image.repository }}@{{ .Values.image.digest }}
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:{{ .Values.metrics.port }}
            - --protocol
            - {{ .Values.protocol }}
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.secret.key }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: origin-ca
              mountPath: {{ dir .Values.origin.caPoolPath }}
              readOnly: true
      volumes:
        - name: origin-ca
          configMap:
            name: home-server-cloudflared-ca
