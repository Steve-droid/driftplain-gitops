# Backend subchart defaults. The umbrella's `backend:` block overrides these when
# rendered as part of the product chart; these values also make the subchart
# render standalone (`helm template charts/modelmatch/charts/backend`).
enabled: true
replicaCount: 1

# global.awsAccountId / global.awsRegion (P33b) are injected by the umbrella ONLY — no
# copy here, on purpose (one source of truth for the account). A standalone render
# must pass them: --set-string global.awsAccountId=<id>,global.awsRegion=<region>.
global:
  # P15: the public-host source of truth, normally injected by the umbrella. The
  # ConfigMap derives PUBLIC_BASE_URL/CORS_ALLOW_ORIGINS from it; this default keeps
  # standalone render working. "0.0.0.0" = not-yet-computed sentinel.
  sslipIp: "0.0.0.0"
  appHost: ""
  apiHost: ""
  useCustomHosts: false
  retainSslipHosts: true
  runtimeHostSet: ""
  additionalHosts: {}

image:
  repository: modelmatch-backend
  # 1.0.1 carries boto3 (built with --extra bedrock) for the in-cluster Bedrock surface.
  tag: "1.0.1"
  pullPolicy: IfNotPresent
  # E21 profile knobs, both empty on AWS: `registry` replaces the derived ECR host
  # (home: ghcr.io/steve-droid); `digest` ("sha256:…") pins the ref by content instead
  # of by tag (home: the reviewed GHCR copy of the same release).
  registry: ""
  digest: ""

containerPort: 8000

# IRSA (P14). The SA name is PINNED (role A's trust is bound to
# system:serviceaccount:app:modelmatch-backend) — do not change it. The role-arn
# annotation is templated (P33b) as arn:aws:iam::<global.awsAccountId>:role/<irsaRoleName>;
# only the role NAME lives here. `annotations` = optional extras merged in.
serviceAccount:
  create: true
  name: modelmatch-backend
  automount: true
  # Empty = no IRSA annotation at all (E21 home profile); the SA name stays pinned.
  irsaRoleName: modelmatch-backend-irsa
  annotations: {}

# ESO-synced Secret (P12) the secret env reads from. Non-secret NAME, not the values.
appSecretName: modelmatch-app-secrets

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

config:
  # Optional public Google OAuth WEB client ID (not a secret).
  GOOGLE_CLIENT_ID: ""
  BASELINE_MODEL_ID: "Claude Sonnet 4.5"
  QUALITY_THRESHOLD: "0.8"
  AWS_REGION: "ap-south-1"
  BEDROCK_MODEL_ID: "apac.amazon.nova-lite-v1:0"
  S3_BUCKET: "modelmatch-ingestion-sources-957261948820"
  LLM_CLIENT: "bedrock"
  LLM_HOURLY_TOKEN_CAP: "200000"
  MAX_REGISTERED_USERS: "700"
  SEED_NEW_USER_EXAMPLES: "true"
  CHAT_ENABLED: "true"
  AUTH_RATE_LIMIT_ENABLED: "true"
  AUTH_REQUESTS_PER_MINUTE: "120"
  AUTH_BURST: "4"
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "5"
  CHAT_DB_POOL_SIZE: "2"
  CHAT_DB_MAX_OVERFLOW: "2"
  DB_POOL_TIMEOUT: "5"
  # P15: PUBLIC_BASE_URL + CORS_ALLOW_ORIGINS are derived from global.sslipIp in the
  # ConfigMap template (single source of truth) — not literals here.
  # Passwordless DSN (non-secret) — the password comes from PGPASSWORD (P14 secret env).
  # Host = the CNPG primary read-write Service (P13).
  DATABASE_URL: "postgresql+psycopg://modelmatch@modelmatch-postgres-rw:5432/modelmatch"
  # Chat read-only role NAME (non-secret) — must match what the P13 migration created.
  CHAT_READONLY_DB_USER: "modelmatch_chat_ro"
