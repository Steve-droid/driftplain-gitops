{{- if .Values.serviceAccount.create -}}
# Backend ServiceAccount — the IRSA identity for the in-cluster backend (P14).
#
# The role-arn annotation is what makes this SA an IRSA principal: the EKS Pod Identity
# webhook sees it and injects a projected web-identity token + AWS_ROLE_ARN /
# AWS_WEB_IDENTITY_TOKEN_FILE into every pod that uses this SA, so boto3's default
# credential chain assumes role A — Bedrock InvokeModel on the 2 Nova inference-profile
# ARNs + S3 get/put on modelmatch-ingestion-sources. NO static AWS keys anywhere.
#
# The SA NAME must stay modelmatch-backend: role A's trust policy is bound (in Terraform,
# P7) to system:serviceaccount:app:modelmatch-backend. The ARN is non-secret (account id +
# role name, no credential) and is TEMPLATED (P33b) from global.awsAccountId + the role
# name in values, so the account id is never a literal in this chart.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "backend.serviceAccountName" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
  {{- /* E21 home profile: irsaRoleName "" omits the IRSA annotation (no EKS webhook, no AWS
       identity from the SA); the pod then has NO AWS credentials unless a separately reviewed
       Roles Anywhere mount provides them. AWS renders exactly as before. */}}
  {{- if or .Values.serviceAccount.irsaRoleName .Values.serviceAccount.annotations }}
  annotations:
    {{- if .Values.serviceAccount.irsaRoleName }}
    eks.amazonaws.com/role-arn: arn:aws:iam::{{ required "global.awsAccountId is required (set in the umbrella values)" .Values.global.awsAccountId | toString }}:role/{{ .Values.serviceAccount.irsaRoleName }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
# IRSA does not depend on the default Kubernetes API token (the webhook injects a
# SEPARATE projected volume for the AWS token), so this only governs the k8s API token.
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
