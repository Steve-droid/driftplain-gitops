# values-home-server.yaml — E21/HM4 home-server PROFILE for the charts/modelmatch umbrella.
#
# Layered ON TOP of values.yaml (ArgoCD: helm.valueFiles [values.yaml, this]); it overrides
# only what differs at home, so the application CONTRACT is unchanged: the release images
# (by content digest, not by tag), the same Secret name/keys, DATABASE_URL to the same CNPG
# `-rw` Service, the same limits (backend 1Gi ingestion-OOM cap), the same rate limits.
#
# What differs, and why:
#   • Images: public GHCR, pinned by digest. Agents are the 1.1.3 ECR copies (crane copy,
#     digest equals the ECR source). Backend 1.0.25 was built locally from its tag (the honest
#     offline chat answer for LLM_CLIENT=fake). Frontend 1.0.26 comes from the GitHub Actions
#     release workflow: no temporary-demo notice, privacy policy for the home deployment.
#   • No IRSA: there is no EKS webhook. `irsaRoleName: ""` omits the annotation; the pod then
#     holds NO AWS identity (the Roles Anywhere mount is a separate HM5 approval).
#   • Isolated validation: LLM_CLIENT=fake and BLOB_STORE=fake — no Bedrock call, no S3 write.
#     Production never sees these values; they exist only in this profile.
#   • Hosts: the branded pair is private (app/api.home-server.driftplain.dev, not in public
#     DNS; the tunnel dials the ingress with that SNI and Host header). Two public host sets
#     sit behind Cloudflare: `driftplain` (the runtime pair driftplain.dev / api.driftplain.dev,
#     served from home since HM7 — the September 22, 2026 cutover after the AWS compute
#     retirement) and `staging` (HM5). `runtimeHostSet: driftplain` selects the API URL the
#     frontend's config.js names and puts https://driftplain.dev among the CORS origins the
#     backend (and its Google sign-in origin check) accepts; the staging pair stays enabled as
#     an accepted origin. Public host-set ingress objects render like any host set but never
#     receive traffic (the tunnel arrives with the private SNI). sslip.io stays off; the F5
#     ingress masters name the private CA issuer `home-server-ca`.
#   • Agent images in the generated Jenkins snippets point at the public GHCR copies.
global:
  sslipIp: "0.0.0.0" # sentinel; retainSslipHosts=false renders no sslip host
  appHost: "app.home-server.driftplain.dev"
  apiHost: "api.home-server.driftplain.dev"
  useCustomHosts: true
  retainSslipHosts: false
  runtimeHostSet: "driftplain"
  additionalHosts:
    driftplain:
      enabled: true
      appHost: "driftplain.dev"
      apiHost: "api.driftplain.dev"
    staging:
      enabled: true
      appHost: "staging.driftplain.dev"
      apiHost: "api-staging.driftplain.dev"
ingress:
  clusterIssuer: home-server-ca
backend:
  image:
    registry: ghcr.io/steve-droid
    digest: "sha256:df0d18b761b7efbb14c3e14267c5ccb80725cc3a418e8f09e83480314cc0a348"
  serviceAccount:
    irsaRoleName: ""
  config:
    LLM_CLIENT: "fake"
    BLOB_STORE: "fake"
    AGENT_IMAGE: "ghcr.io/steve-droid/modelmatch-agent@sha256:064446aaca9611b0f7f55568cfda89b000f662bafe791bf34a4e95da431567be"
    AGENT_SECURITY_IMAGE: "ghcr.io/steve-droid/modelmatch-agent-security@sha256:0b1c0f73a4f0b6d5517be500fef7fda4e173b7307e1d95672961e2131031e0d2"
frontend:
  image:
    registry: ghcr.io/steve-droid
    digest: "sha256:e945ec580aa3692d0ed181c7b45d1291e10aa4eba0afe972b435fa0250f0671f"
